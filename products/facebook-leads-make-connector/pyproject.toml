[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadbridge"
version = "0.1.0"
description = "Reliable Facebook Lead Ads to Make.com webhook bridge: fixes multi-form field mapping and Graph API lead-retrieval failures."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leadbridge"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1,localhost"

[tool.ruff]
line-length = 100
target-version = "py312"
