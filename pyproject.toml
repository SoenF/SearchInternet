[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opportunity-engine"
version = "0.1.0"
description = "Detects, scores, and ranks micro-SaaS opportunities from free/official signal sources."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "sentence-transformers==2.7.0",
    "torch==2.10.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "tenacity>=8.2",
    "anthropic>=0.120",
    "praw>=7.7",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-socket>=0.7",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opportunity_engine"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/fixtures"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1,localhost"

[tool.ruff]
line-length = 100
target-version = "py312"
